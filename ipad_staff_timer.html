<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>スタッフタイマー</title><style>
*{box-sizing:border-box}body{margin:0;background:#06101b;color:white;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:13px 20px}header h1{font-size:20px;margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;color:white} .topbtn{background:#24354a;padding:10px 15px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 16px 18px}.card{border:1px solid var(--c);border-radius:18px;overflow:hidden;background:linear-gradient(140deg,#101825,#050b13);min-width:0}.bar{background:var(--c);padding:10px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.num{background:#0003;border-radius:9px;padding:3px 12px}.edit{margin-left:auto;background:none;font-size:20px}.circle{height:175px;width:175px;max-width:90%;aspect-ratio:1;border-radius:50%;border:12px solid #243344;margin:14px auto 0;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}.circle:before{content:"";position:absolute;inset:-12px;border-radius:50%;border:12px solid transparent;border-top-color:var(--c);border-right-color:var(--c);transform:rotate(var(--rot,0deg))}.time{font-size:40px;font-weight:850;font-variant-numeric:tabular-nums;z-index:1}.sub{font-size:13px;z-index:1}.actions{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:-2px}.play{background:var(--c);height:64px;width:64px;border-radius:50%;font-size:29px}.stop{background:#32465e;border-radius:50%;height:52px;width:52px;font-size:15px}.bottom{display:flex;gap:8px;padding:13px}.tile{background:#172434;border:1px solid #405671;border-radius:13px;padding:9px 5px;flex:1;text-align:center;font-size:14px}.tile strong{display:block;font-size:21px}.tile.history{flex:.6;font-size:19px}.running .circle{box-shadow:0 0 20px color-mix(in srgb,var(--c) 35%,transparent)}.modalwrap{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalwrap.show{display:flex}.modal{background:#122134;border:1px solid #4c6077;border-radius:22px;padding:23px;max-height:90vh;overflow:auto;width:min(560px,100%)}.modal h2{margin:0 0 18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.row input{width:135px;background:#23354b;border:1px solid #53667c;border-radius:9px;padding:10px;color:white}.row input[type=text]{width:220px}.primary{background:#008cff;padding:13px 20px;border-radius:11px}.secondary{background:#405168;padding:13px 20px;border-radius:11px}.danger{background:#a93b54;padding:13px 20px;border-radius:11px}.buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choices button{background:#087ce8;border-radius:12px;padding:20px 0;font-size:22px}.hint{color:#b9c8da;font-size:13px}.record{background:#203247;border-radius:12px;padding:12px;margin:9px 0}.good{color:#3ceaa5}.bad{color:#ff8798}.feedback{text-align:center;padding:20px;border-radius:15px;background:#123d37}.feedback.late{background:#332333}.feedback h2{font-size:34px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button{padding:8px 13px;border-radius:9px;background:#32445a}.tabs button.active{background:#008cff}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.circle{height:200px;width:200px}}
</style></head><body><header><h1>⏱ スタッフタイマー</h1><button class="topbtn" onclick="settings()">⚙ 設定</button></header><main class="grid" id="grid"></main><div class="modalwrap" id="wrap"><section class="modal" id="modal"></section></div><script>
const KEY='staffTimerV1',colors=['#ff3165','#0789ff','#00d48a','#ff8b0a','#913aff','#ffc400','#00c6d5','#fa3387'],defaults=['機種変更','MNP','補償','データ移植','ノートン','まるっと復旧','全部まるっと','光'];
const init=()=>({names:'ABCDEFGH'.split('').map(x=>x+'さん'),durations:[40,70,90,110,130],items:defaults.map(x=>({name:x,value:1,enabled:true})),staff:Array.from({length:8},()=>({end:null,start:null,planned:0,units:0,records:[]}))});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||init()}catch{data=init()}if(!data.items)data.items=init().items;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),pad=n=>String(n).padStart(2,'0'),fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));return `${pad(Math.floor(s/60))}:${pad(s%60)}`},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('grid').innerHTML=data.staff.map((s,i)=>{let remain=s.end? s.end-Date.now():data.durations[0]*60000,elapsed=s.start?Date.now()-s.start:0,display=s.end?fmt(Math.abs(remain)):fmt(data.durations[0]*60000),pct=s.end?Math.min(100,elapsed/(s.planned*60000)*100):0;return `<article class="card ${s.end?'running':''}" style="--c:${colors[i]}"><div class="bar"><span class="num">${i+1}</span><span>${esc(data.names[i])}</span><button class="edit" onclick="rename(${i})">✎</button></div><div class="circle" style="--rot:${pct*3.6}deg"><div class="time">${display}</div><div class="sub">${s.end?(remain<0?'超過時間':'残り時間'):'待機中'}</div></div><div class="actions">${s.end?`<button class="play" onclick="finish(${i})">■</button>`:`<button class="play" onclick="start(${i})">▶</button>`}<button class="stop" onclick="reset(${i})">↻</button></div><div class="bottom"><div class="tile">設定時間<strong>${s.end?s.planned:data.durations[0]}分</strong></div><button class="tile history" onclick="history(${i})">▤<br>履歴</button></div></article>`}).join('')}
function modal(content){document.getElementById('modal').innerHTML=content;document.getElementById('wrap').classList.add('show')}function closeModal(){document.getElementById('wrap').classList.remove('show')}
function rename(i){modal(`<h2>スタッフ名の変更</h2><div class="row"><input id="newname" value="${esc(data.names[i])}"></div><div class="buttons"><button class="secondary" onclick="closeModal()">戻る</button><button class="primary" onclick="data.names[${i}]=document.getElementById('newname').value||'スタッフ${i+1}';save();closeModal();render()">保存</button></div>`)}
function start(i){if(data.staff[i].end)return;modal(`<h2>${esc(data.names[i])}：何台？</h2><p>台数を選ぶとタイマーが始まります。</p><div class="choices">${data.durations.map((v,j)=>`<button onclick="begin(${i},${j+1})">${j+1}台<small style="display:block;font-size:12px">${v}分</small></button>`).join('')}</div><div class="buttons"><button class="secondary" onclick="closeModal()">キャンセル</button></div>`)}
function begin(i,n){let s=data.staff[i];s.start=Date.now();s.planned=data.durations[n-1];s.end=s.start+s.planned*60000;s.units=n;save();closeModal();render()}
function reset(i){if(data.staff[i].end){if(!confirm('計測を破棄しますか？ 履歴には残りません。'))return;data.staff[i].end=null;data.staff[i].start=null;save();render()}else start(i)}
function finish(i){let s=data.staff[i],mins=(Date.now()-s.start)/60000,delta=s.planned-mins;modal(`<h2>${esc(data.names[i])}：終了・受注入力</h2><div class="feedback ${delta<0?'late':''}"><h2>${delta>=0?'🎉 おめでとう！':'時間オーバー'}</h2><div>${delta>=0?'残り '+fmt(delta*60000):'超過 '+fmt(-delta*60000)} ／ 実績 ${fmt(mins*60000)}</div></div><p class="hint">受注件数と労働時間を入力してください。労働時間は実際の作業時間を初期値にしています。</p>${data.items.filter(x=>x.enabled).map((x,j)=>`<div class="row"><label>${esc(x.name)}（単価 ${x.value}）</label><input type="number" min="0" step="1" value="0" data-count="${j}"></div>`).join('')}<div class="row"><label>労働時間（時間）</label><input type="number" min="0.01" step="0.01" id="hours" value="${(mins/60).toFixed(2)}"></div><div class="buttons"><button class="secondary" onclick="closeModal()">戻る</button><button class="primary" onclick="complete(${i})">保存して終了</button></div>`)}
function complete(i){let s=data.staff[i],active=data.items.filter(x=>x.enabled),counts=[...document.querySelectorAll('[data-count]')].map(el=>Math.max(0,Math.floor(+el.value||0))),hours=+document.getElementById('hours').value;if(!(hours>0)){alert('労働時間は0より大きい数を入力してください');return}let amount=counts.reduce((a,n,j)=>a+n*active[j].value,0),end=Date.now(),elapsed=(end-s.start)/60000,record={date:new Date(end).toLocaleDateString('ja-JP'),timestamp:end,units:s.units,planned:s.planned,elapsed,delta:s.planned-elapsed,amount,hours,productivity:amount/hours,detail:active.map((x,j)=>({name:x.name,count:counts[j],value:x.value}))};s.records.unshift(record);s.end=null;s.start=null;save();modal(`<div class="feedback ${record.delta<0?'late':''}"><h2>${record.delta>=0?'🎉 おめでとう！':'時間オーバー'}</h2><p>${record.delta>=0?'残り':'超過'} ${fmt(Math.abs(record.delta)*60000)}</p><h2>受注合計 ${amount.toLocaleString()}</h2><p>生産性 ${record.productivity.toFixed(2)}／時間</p></div><div class="buttons"><button class="primary" onclick="closeModal();render()">閉じる</button></div>`);render()}
function history(i){let s=data.staff[i];modal(`<h2>${esc(data.names[i])} の履歴</h2><p class="hint">日付・所要時間・時間差・受注額・生産性</p>${s.records.length?s.records.map(r=>`<div class="record"><strong>${esc(r.date)}　${r.units}台</strong><div>所要 ${fmt(r.elapsed*60000)} ／ <b class="${r.delta>=0?'good':'bad'}">${r.delta>=0?'+':'−'}${fmt(Math.abs(r.delta)*60000)}</b></div><div>受注合計 ${r.amount.toLocaleString()} ／ 生産性 ${r.productivity.toFixed(2)}/時間</div><details><summary>受注内訳</summary>${r.detail.filter(x=>x.count).map(x=>`<div>${esc(x.name)} ${x.count}件 × ${x.value}</div>`).join('')||'入力なし'}<div>労働時間 ${r.hours}時間</div></details></div>`).join(''):'履歴はまだありません'}<div class="buttons"><button class="secondary" onclick="closeModal()">閉じる</button></div>`)}
function settings(){modal(`<h2>⚙ アプリ設定</h2><h3>台数別の制限時間（分）</h3>${data.durations.map((v,i)=>`<div class="row"><label>${i+1}台</label><input type="number" min="1" id="duration${i}" value="${v}"></div>`).join('')}<h3>受注項目・1件あたりの換算値</h3><p class="hint">換算値は自由に設定できます。受注合計＝件数×換算値の合計。生産性＝受注合計÷労働時間。</p><div id="itemlist">${data.items.map((x,i)=>itemrow(x,i)).join('')}</div><button class="secondary" onclick="addItem()">＋ 項目追加</button><div class="buttons"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveSettings()">設定を保存</button></div>`)}
function itemrow(x,i){return `<div class="row" data-itemrow><input type="checkbox" ${x.enabled?'checked':''} style="width:20px" aria-label="有効"><input type="text" value="${esc(x.name)}" placeholder="項目名" style="width:42%"><input type="number" step="0.01" value="${x.value}" style="width:90px" aria-label="換算値"><button class="danger" onclick="this.closest('[data-itemrow]').remove()">×</button></div>`}
function addItem(){document.getElementById('itemlist').insertAdjacentHTML('beforeend',itemrow({name:'新しい項目',value:1,enabled:true},0))}
function saveSettings(){let durations=data.durations.map((_,i)=>+document.getElementById('duration'+i).value);if(durations.some(x=>!Number.isFinite(x)||x<=0)){alert('制限時間は1以上で入力してください');return}let items=[...document.querySelectorAll('[data-itemrow]')].map(row=>{let el=row.querySelectorAll('input');return {enabled:el[0].checked,name:el[1].value.trim(),value:+el[2].value}});if(items.some(x=>!x.name||!Number.isFinite(x.value)||x.value<0)){alert('項目名と0以上の換算値を入力してください');return}data.durations=durations;data.items=items;save();closeModal();render()}
render();setInterval(render,1000);
</script></body></html>
