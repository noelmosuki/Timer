<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>スタッフタイマー</title><style>
*{box-sizing:border-box}body{margin:0;background:#06101b;color:white;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:13px 20px}header h1{font-size:20px;margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;color:white} .topbtn{background:#24354a;padding:10px 15px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 16px 18px}.card{border:1px solid var(--c);border-radius:18px;overflow:hidden;background:linear-gradient(140deg,#101825,#050b13);min-width:0}.bar{background:var(--c);padding:10px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.num{background:#0003;border-radius:9px;padding:3px 12px}.edit{margin-left:auto;background:none;font-size:20px}.circle{height:175px;width:175px;max-width:90%;aspect-ratio:1;border-radius:50%;border:12px solid #243344;margin:14px auto 0;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}.circle:before{content:"";position:absolute;inset:-12px;border-radius:50%;border:12px solid transparent;border-top-color:var(--c);border-right-color:var(--c);transform:rotate(var(--rot,0deg))}.time{font-size:40px;font-weight:850;font-variant-numeric:tabular-nums;z-index:1}.sub{font-size:13px;z-index:1}.actions{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:-2px}.play{background:var(--c);height:64px;width:64px;border-radius:50%;font-size:29px}.stop{background:#32465e;border-radius:50%;height:52px;width:52px;font-size:15px}.bottom{display:flex;gap:8px;padding:13px}.tile{background:#172434;border:1px solid #405671;border-radius:13px;padding:9px 5px;flex:1;text-align:center;font-size:14px}.tile strong{display:block;font-size:21px}.tile.history{flex:.6;font-size:19px}.running .circle{box-shadow:0 0 20px color-mix(in srgb,var(--c) 35%,transparent)}.modalwrap{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalwrap.show{display:flex}.modal{background:#122134;border:1px solid #4c6077;border-radius:22px;padding:23px;max-height:90vh;overflow:auto;width:min(560px,100%)}.modal h2{margin:0 0 18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.row input{width:135px;background:#23354b;border:1px solid #53667c;border-radius:9px;padding:10px;color:white}.row input[type=text]{width:220px}.primary{background:#008cff;padding:13px 20px;border-radius:11px}.secondary{background:#405168;padding:13px 20px;border-radius:11px}.danger{background:#a93b54;padding:13px 20px;border-radius:11px}.buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choices button{background:#087ce8;border-radius:12px;padding:20px 0;font-size:22px}.hint{color:#b9c8da;font-size:13px}.record{background:#203247;border-radius:12px;padding:12px;margin:9px 0}.good{color:#3ceaa5}.bad{color:#ff8798}.feedback{text-align:center;padding:20px;border-radius:15px;background:#123d37}.feedback.late{background:#332333}.feedback h2{font-size:clamp(22px,3vw,30px);line-height:1.4}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button{padding:8px 13px;border-radius:9px;background:#32445a}.tabs button.active{background:#008cff}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.circle{height:200px;width:200px}}
</style></head><body><header><h1>⏱ スタッフタイマー</h1><div style="display:flex;gap:8px"><button class="topbtn" onclick="backupMenu()">💾 保存・出力</button><button class="topbtn" onclick="settings()">⚙ 設定</button></div></header><main class="grid" id="grid"></main><div class="modalwrap" id="wrap"><section class="modal" id="modal"></section></div><script>
const KEY='staffTimerV1',colors=['#ff3165','#0789ff','#00d48a','#ff8b0a','#913aff','#ffc400','#00c6d5','#fa3387'],defaults=['機種変更','MNP','補償','データ移植','ノートン','まるっと復旧','全部まるっと','光'];
const init=()=>({names:'ABCDEFGH'.split('').map(x=>x+'さん'),durations:[40,70,90,110,130],items:defaults.map(x=>({name:x,value:1,enabled:true})),staff:Array.from({length:8},()=>({end:null,start:null,pausedAt:null,pausedTotal:0,planned:0,units:0,records:[]}))});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||init()}catch{data=init()}if(!data.items)data.items=init().items;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),pad=n=>String(n).padStart(2,'0'),fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));return `${pad(Math.floor(s/60))}:${pad(s%60)}`},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function elapsedMs(s){return s.start?Math.max(0,(s.pausedAt||Date.now())-s.start-(s.pausedTotal||0)):0}
function remainingMs(s){return s.planned*60000-elapsedMs(s)}
function render(){document.getElementById('grid').innerHTML=data.staff.map((s,i)=>{let remain=s.end?remainingMs(s):data.durations[0]*60000,elapsed=elapsedMs(s),display=s.end?fmt(Math.abs(remain)):fmt(data.durations[0]*60000),pct=s.end?Math.min(100,elapsed/(s.planned*60000)*100):0;return `<article class="card ${s.end?'running':''}" style="--c:${colors[i]}"><div class="bar"><span class="num">${i+1}</span><span>${esc(data.names[i])}</span><button class="edit" onclick="rename(${i})">✎</button></div><div class="circle" style="--rot:${pct*3.6}deg"><div class="time">${display}</div><div class="sub">${s.end?(s.pausedAt?'一時停止中':remain<0?'超過時間':'残り時間'):'待機中'}</div></div><div class="actions">${s.end?`<button class="play" onclick="finish(${i})">■</button><button class="stop" onclick="pause(${i})">${s.pausedAt?'▶':'Ⅱ'}</button>`:`<button class="play" onclick="start(${i})">▶</button>`}<button class="stop" onclick="reset(${i})">↻</button></div><div class="bottom"><div class="tile">設定時間<strong>${s.end?s.planned:data.durations[0]}分</strong></div><button class="tile history" onclick="history(${i})">▤<br>履歴</button></div></article>`}).join('')}
function modal(content){document.getElementById('modal').innerHTML=content;document.getElementById('wrap').classList.add('show')}function closeModal(){document.getElementById('wrap').classList.remove('show')}
function rename(i){modal(`<h2>スタッフ名の変更</h2><div class="row"><input id="newname" value="${esc(data.names[i])}"></div><div class="buttons"><button class="secondary" onclick="closeModal()">戻る</button><button class="primary" onclick="data.names[${i}]=document.getElementById('newname').value||'スタッフ${i+1}';save();closeModal();render()">保存</button></div>`)}
function start(i){if(data.staff[i].end)return;modal(`<h2>${esc(data.names[i])}：何台？</h2><p>台数を選ぶとタイマーが始まります。</p><div class="choices">${data.durations.map((v,j)=>`<button onclick="begin(${i},${j+1})">${j+1}台<small style="display:block;font-size:12px">${v}分</small></button>`).join('')}</div><div class="buttons"><button class="secondary" onclick="closeModal()">キャンセル</button></div>`)}
function begin(i,n){let s=data.staff[i];s.start=Date.now();s.planned=data.durations[n-1];s.end=s.start+s.planned*60000;s.pausedAt=null;s.pausedTotal=0;s.units=n;save();closeModal();render()}
function pause(i){let s=data.staff[i];if(!s.end)return;if(s.pausedAt){let paused=Date.now()-s.pausedAt;s.pausedTotal=(s.pausedTotal||0)+paused;s.end+=paused;s.pausedAt=null}else{s.pausedAt=Date.now()}save();render()}
function reset(i){if(data.staff[i].end){if(!confirm('計測を破棄しますか？ 履歴には残りません。'))return;data.staff[i].end=null;data.staff[i].start=null;data.staff[i].pausedAt=null;data.staff[i].pausedTotal=0;save();render()}else start(i)}
// 残り時間の割合に合わせたメッセージ（0%未満は時間超過）
function resultMessage(delta,planned){
 if(delta<0)return '次は時間内を目指しましょう';
 const ratio=planned>0?delta/planned:0;
 if(ratio>=.4)return '圧倒的なスピード！ 素晴らしい成果です';
 if(ratio>=.25)return '驚くほどスムーズ！ 見事な対応です';
 if(ratio>=.1)return 'いいペースです！ 余裕を持って完了しました';
 if(ratio>0)return '時間内に完了！ 最後までよく頑張りました';
 return '時間ぴったり！ 見事に完了しました';
}
// 外部音源不要。iPadのブラウザで鳴る短い達成チャイム。
let audioContext;
function playSuccessSound(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  audioContext=audioContext||new AudioCtx();
  if(audioContext.state==='suspended')audioContext.resume();
  const now=audioContext.currentTime;
  [[523.25,0,.16],[659.25,.13,.16],[783.99,.26,.18],[1046.5,.42,.38]].forEach(([hz,offset,length])=>{
   const osc=audioContext.createOscillator(),gain=audioContext.createGain();
   osc.type='sine';osc.frequency.value=hz;
   gain.gain.setValueAtTime(.0001,now+offset);
   gain.gain.exponentialRampToValueAtTime(.11,now+offset+.025);
   gain.gain.exponentialRampToValueAtTime(.0001,now+offset+length);
   osc.connect(gain);gain.connect(audioContext.destination);
   osc.start(now+offset);osc.stop(now+offset+length+.02);
  });
 }catch(e){console.warn('サウンドを再生できませんでした',e)}
}
function finish(i){let s=data.staff[i],mins=elapsedMs(s)/60000,delta=s.planned-mins;modal(`<h2>${esc(data.names[i])}：終了・受注入力</h2><div class="feedback ${delta<0?'late':''}"><h2>${delta>=0?resultMessage(delta,s.planned):'時間オーバー'}</h2><div>${delta>=0?'残り '+fmt(delta*60000):'超過 '+fmt(-delta*60000)} ／ 実績 ${fmt(mins*60000)}</div></div><p class="hint">受注件数と労働時間を入力してください。労働時間は実際の作業時間を初期値にしています。</p>${data.items.filter(x=>x.enabled).map((x,j)=>`<div class="row"><label>${esc(x.name)}（単価 ${x.value}）</label><input type="number" min="0" step="1" value="0" data-count="${j}"></div>`).join('')}<div class="row"><label>労働時間（時間）</label><input type="number" min="0.01" step="0.01" id="hours" value="${(mins/60).toFixed(2)}"></div><div class="buttons"><button class="secondary" onclick="closeModal()">戻る</button><button class="primary" onclick="complete(${i})">保存して終了</button></div>`)}
function complete(i){let s=data.staff[i],active=data.items.filter(x=>x.enabled),counts=[...document.querySelectorAll('[data-count]')].map(el=>Math.max(0,Math.floor(+el.value||0))),hours=+document.getElementById('hours').value;if(!(hours>0)){alert('労働時間は0より大きい数を入力してください');return}let amount=counts.reduce((a,n,j)=>a+n*active[j].value,0),end=Date.now(),elapsed=elapsedMs(s)/60000,record={date:new Date(end).toLocaleDateString('ja-JP'),timestamp:end,units:s.units,planned:s.planned,elapsed,delta:s.planned-elapsed,amount,hours,productivity:amount/hours,detail:active.map((x,j)=>({name:x.name,count:counts[j],value:x.value}))};s.records.unshift(record);if(record.delta>=0)playSuccessSound();s.end=null;s.start=null;s.pausedAt=null;s.pausedTotal=0;save();modal(`<div class="feedback ${record.delta<0?'late':''}"><h2>${record.delta>=0?resultMessage(record.delta,record.planned):'時間オーバー'}</h2><p>${record.delta>=0?'残り':'超過'} ${fmt(Math.abs(record.delta)*60000)}</p><h2>受注合計 ¥${amount.toLocaleString()}</h2><p>生産性 ¥${Math.round(record.productivity).toLocaleString("ja-JP")}／時間</p></div><div class="buttons"><button class="primary" onclick="closeModal();render()">閉じる</button></div>`);render()}
function history(i){let s=data.staff[i];modal(`<h2>${esc(data.names[i])} の履歴</h2><p class="hint">日付・所要時間・時間差・受注額・生産性</p>${s.records.length?s.records.map(r=>`<div class="record"><strong>${esc(r.date)}　${r.units}台</strong><div>所要 ${fmt(r.elapsed*60000)} ／ <b class="${r.delta>=0?'good':'bad'}">${r.delta>=0?'+':'−'}${fmt(Math.abs(r.delta)*60000)}</b></div><div>受注合計 ¥${r.amount.toLocaleString()} ／ 生産性 ¥${Math.round(r.productivity).toLocaleString("ja-JP")}/時間</div><button class="topbtn" style="margin-top:8px" onclick="editHistory(${i},${s.records.indexOf(r)})">✎ この履歴を編集</button><details><summary>受注内訳</summary>${r.detail.filter(x=>x.count).map(x=>`<div>${esc(x.name)} ${x.count}件 × ${x.value}</div>`).join('')||'入力なし'}<div>労働時間 ${r.hours}時間</div></details></div>`).join(''):'履歴はまだありません'}<div class="buttons"><button class="secondary" onclick="closeModal()">閉じる</button></div>`)}
function editHistory(i,k){let r=data.staff[i].records[k];if(!r)return;modal(`<h2>${esc(data.names[i])}：履歴の編集</h2><div class="row"><label>日付</label><input type="date" id="editdate" value="${new Date(r.timestamp).getFullYear()}-${pad(new Date(r.timestamp).getMonth()+1)}-${pad(new Date(r.timestamp).getDate())}"></div><div class="row"><label>台数</label><input type="number" min="1" id="editunits" value="${r.units}"></div><div class="row"><label>設定時間（分）</label><input type="number" min="1" id="editplanned" value="${r.planned}"></div><div class="row"><label>所要時間（分）</label><input type="number" min="0" step="0.01" id="editelapsed" value="${r.elapsed.toFixed(2)}"></div><h3>受注内訳</h3>${r.detail.map((x,j)=>`<div class="row"><label>${esc(x.name)}（換算値 ${x.value}）</label><input type="number" min="0" step="1" data-editcount="${j}" value="${x.count}"></div>`).join('')}<div class="row"><label>労働時間（時間）</label><input type="number" min="0.01" step="0.01" id="edithours" value="${r.hours}"></div><p class="hint">保存すると時間差・受注合計・生産性を再計算します。</p><div class="buttons"><button class="secondary" onclick="history(${i})">戻る</button><button class="primary" onclick="saveHistory(${i},${k})">変更を保存</button></div>`)}
function saveHistory(i,k){let r=data.staff[i].records[k];if(!r)return;let date=document.getElementById('editdate').value,units=+document.getElementById('editunits').value,planned=+document.getElementById('editplanned').value,elapsed=+document.getElementById('editelapsed').value,hours=+document.getElementById('edithours').value,counts=[...document.querySelectorAll('[data-editcount]')].map(x=>+x.value);if(!date||!Number.isInteger(units)||units<1||!(planned>0)||elapsed<0||!Number.isFinite(elapsed)||!(hours>0)||counts.some(x=>!Number.isInteger(x)||x<0)){alert('入力値を確認してください');return}let d=new Date(date+'T12:00:00');r.timestamp=d.getTime();r.date=d.toLocaleDateString('ja-JP');r.units=units;r.planned=planned;r.elapsed=elapsed;r.delta=planned-elapsed;r.hours=hours;r.detail.forEach((x,j)=>x.count=counts[j]);r.amount=r.detail.reduce((sum,x)=>sum+x.count*x.value,0);r.productivity=r.amount/hours;save();history(i)}
function settings(){modal(`<h2>⚙ アプリ設定</h2><h3>台数別の制限時間（分）</h3>${data.durations.map((v,i)=>`<div class="row"><label>${i+1}台</label><input type="number" min="1" id="duration${i}" value="${v}"></div>`).join('')}<h3>受注項目・1件あたりの換算値</h3><p class="hint">換算値は自由に設定できます。受注合計＝件数×換算値の合計。生産性＝受注合計÷労働時間。</p><div id="itemlist">${data.items.map((x,i)=>itemrow(x,i)).join('')}</div><button class="secondary" onclick="addItem()">＋ 項目追加</button><div class="buttons"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveSettings()">設定を保存</button></div>`)}
function itemrow(x,i){return `<div class="row" data-itemrow><input type="checkbox" ${x.enabled?'checked':''} style="width:20px" aria-label="有効"><input type="text" value="${esc(x.name)}" placeholder="項目名" style="width:42%"><input type="number" step="0.01" value="${x.value}" style="width:90px" aria-label="換算値"><button class="danger" onclick="this.closest('[data-itemrow]').remove()">×</button></div>`}
function addItem(){document.getElementById('itemlist').insertAdjacentHTML('beforeend',itemrow({name:'新しい項目',value:1,enabled:true},0))}
function saveSettings(){let durations=data.durations.map((_,i)=>+document.getElementById('duration'+i).value);if(durations.some(x=>!Number.isFinite(x)||x<=0)){alert('制限時間は1以上で入力してください');return}let items=[...document.querySelectorAll('[data-itemrow]')].map(row=>{let el=row.querySelectorAll('input');return {enabled:el[0].checked,name:el[1].value.trim(),value:+el[2].value}});if(items.some(x=>!x.name||!Number.isFinite(x.value)||x.value<0)){alert('項目名と0以上の換算値を入力してください');return}data.durations=durations;data.items=items;save();closeModal();render()}

function backupMenu(){modal(`<h2>💾 バックアップ・出力</h2><p class="hint">バックアップにはスタッフ名、設定、履歴が含まれます。大切なデータは定期的に「ファイルに保存」してください。</p><div class="buttons" style="justify-content:stretch;flex-direction:column"><button class="primary" onclick="exportBackup()">💾 全データをバックアップ（JSON）</button><button class="primary" onclick="exportCSV()">📊 全スタッフの履歴をCSV出力</button><button class="primary" onclick="shareCSV()">✉️ 履歴をメール等で共有</button><button class="secondary" onclick="document.getElementById('restorefile').click()">🔄 バックアップから復元</button><input type="file" id="restorefile" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"><button class="secondary" onclick="closeModal()">閉じる</button></div><p class="hint">メール送信はiPadの共有画面から「メール」を選択します。メールアプリの設定が必要です。CSVはExcelでも開けます。</p>`)}
function downloadFile(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function stamp(){let d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`}
function exportBackup(){downloadFile(new Blob([JSON.stringify({app:'staffTimerV1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),`スタッフタイマー_バックアップ_${stamp()}.json`)}
function csvContent(){const headings=['日付','スタッフ','台数','設定時間(分)','作業時間(分)','時間差(分)','受注合計','労働時間(時間)','生産性(時間あたり)',...new Set(data.staff.flatMap(s=>s.records.flatMap(r=>(r.detail||[]).map(d=>d.name))))];let rows=[headings];data.staff.forEach((s,i)=>s.records.forEach(r=>{let details=Object.fromEntries((r.detail||[]).map(d=>[d.name,d.count]));rows.push([r.date,data.names[i],r.units,r.planned,Number(r.elapsed).toFixed(2),Number(r.delta).toFixed(2),r.amount,r.hours,Math.round(Number(r.productivity)),...headings.slice(9).map(n=>details[n]??0)])}));return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function csvFile(){return new File([csvContent()],`スタッフタイマー_履歴_${stamp()}.csv`,{type:'text/csv;charset=utf-8'})}
function exportCSV(){downloadFile(csvFile(),`スタッフタイマー_履歴_${stamp()}.csv`)}
async function shareCSV(){let f=csvFile();if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){try{await navigator.share({files:[f],title:'スタッフタイマー 履歴'});return}catch(e){if(e.name==='AbortError')return}}exportCSV();alert('CSVファイルを保存しました。メールに添付して送信してください。')}
async function restoreBackup(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text()),d=obj.data;if(obj.app!=='staffTimerV1'||!d||!Array.isArray(d.names)||d.names.length!==8||!Array.isArray(d.staff)||d.staff.length!==8||!d.staff.every(x=>Array.isArray(x.records))||!Array.isArray(d.durations)||d.durations.length!==5||!Array.isArray(d.items))throw Error('バックアップ形式が正しくありません');if(!confirm('現在のデータをバックアップの内容で上書きします。先に現在のバックアップを保存しましたか？'))return;data=d;save();closeModal();render();alert('復元しました')}catch(err){alert('復元できませんでした：'+err.message)}}
render();setInterval(render,1000);
</script></body></html>
